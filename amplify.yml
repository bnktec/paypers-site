version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - npm ci
    build:
      commands:
        - npm run build
    postBuild:
      commands:
        - npm prune --omit=dev || true
        - chmod +x bin/postbuild.sh
        - ./bin/postbuild.sh
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*